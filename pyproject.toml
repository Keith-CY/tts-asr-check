[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tts-asr-check"
version = "0.1.0"
description = "Check narration audio against its script with two speech recognisers, line by line."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keith" }]
keywords = ["tts", "asr", "speech", "whisper", "qwen3-asr", "pinyin", "narration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["numpy>=1.24", "pypinyin>=0.50"]


[project.urls]
Homepage = "https://github.com/Keith-CY/tts-asr-check"
Issues = "https://github.com/Keith-CY/tts-asr-check/issues"
[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4.2", "mlx-audio>=0.5.7"]
faster-whisper = ["faster-whisper>=1.1"]
transformers = ["transformers>=5.18", "torch>=2.4"]
ja = ["fugashi>=1.3", "unidic-lite>=1.0.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tts-asr-check = "tts_asr_check.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_asr_check"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
